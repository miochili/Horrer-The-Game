<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ashwood Manor — Test Build</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="loading" class="screen" aria-live="polite">
    <div class="spinner"></div>
    <h1>ASHWOOD MANOR</h1>
    <p>Preparing test build…</p>
  </section>
  <section id="menu" class="screen" hidden>
    <h1>ASHWOOD MANOR</h1>
    <p class="subtitle">V5 PLAYABLE TEST BUILD</p>
    <button id="start-button" type="button">START GAME</button>
    <p class="help">WASD: Move · Shift: Run · Mouse: Camera · Esc: Release mouse</p>
  </section>
  <main id="game" hidden>
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="status">Test scene loaded</div>
      <div id="controls">WASD move · Shift run · click to capture mouse</div>
    </div>
  </main>
  <section id="error-panel" class="screen error" hidden>
    <h1>GAME ERROR</h1>
    <pre id="error-text"></pre>
    <button id="reload-button" type="button">RELOAD</button>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
